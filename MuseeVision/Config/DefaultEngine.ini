[/Script/BuildSettings.BuildSettings]
; Two game targets: the desktop museum and the headset museum (MuseeVisionVR); desktop packaging needs this.
DefaultGameTarget=MuseeVision

[/Script/EngineSettings.GameMapsSettings]
GameInstanceClass=/Script/Engine.GameInstance

; ---- Light owns this section: the renderer's transport, one setting per physical reason. ----

[/Script/Engine.RendererSettings]
; Lumen with hardware ray tracing for daylight and reflections; no baked lighting.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
; Reflection rays continue through glass, so cases and panes appear in polished floors and in each other.
r.Lumen.Reflections.HardwareRayTracing.Translucent.Refraction.EnableForProject=True
r.MegaLights.FrontLayerTranslucency.EnableForProject=True
; Substrate: layered physical materials (haze on polished stone, sheen on cloth, coloured transmittance in glass).
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
; Ray-traced shadows: soft, contact-true shadows from the sun through openings and lattices.
r.RayTracing.Shadows=1
; Ray trace the real Nanite geometry, not each mesh's coarse fallback.
r.RayTracing.Nanite.Mode=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
; Shadows are ray traced, so virtual shadow maps are off.
r.Shadow.Virtual.Enable=0
r.MegaLights.EnableForProject=True
r.Nanite.ProjectEnabled=True
; The path tracer is the photometric reference for commissioning and for the lux meter's validation.
r.PathTracing=True
r.SkinCache.CompileShaders=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.CustomDepth=3
r.AntiAliasingMethod=4
; 4K output from DLSS Quality: rendered at 67 % and reconstructed by DLSS Super Resolution with Ray Reconstruction.
r.ScreenPercentage.Default.Desktop.Mode=0
r.ScreenPercentage.Default=66.7

