[SystemSettings]
; Lumen's cached lighting covers exposures up to EV 16 (a sunlit court, the Rotunda under its eye at EV 15.5).
r.EyeAdaptation.CachedLightingPreExposure=8
; NVIDIA DLSS (in C:/mv/third_party/Plugins) in place of TSR.
r.NGX.DLSS.Enable=1
; DLSS Frame Generation (with Reflex), automatic.
r.Streamline.DLSSG.Enable=2
r.VSync=1
; Ray Reconstruction denoises the ray-traced lighting and reflections.
r.NGX.DLSS.DenoiserMode=1
; Contact occlusion traced against the scene (plinths, mouldings, joints), not only on screen.
r.Lumen.ScreenProbeGather.ShortRangeAO.HardwareRayTracing=1
; A surface cache large enough for room-scale pieces.
r.LumenScene.SurfaceCache.AtlasSize=8192
r.LumenScene.SurfaceCache.CardMaxResolution=1024
; A 24 GB card keeps the material evidence and the paintings resident at full resolution.
r.Streaming.PoolSize=10000
r.MaxAnisotropy=16
r.MegaLights.FrontLayerTranslucency.SoftShadows=1

