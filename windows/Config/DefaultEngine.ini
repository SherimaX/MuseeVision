[/Script/BuildSettings.BuildSettings]
; Two game targets: the desktop game, and MuseeVisionVR (VR.md), which Scripts/package_vr.ps1 names.
DefaultGameTarget=MuseeVision

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/Museum.Museum
GameDefaultMap=/Game/Maps/Museum.Museum
GlobalDefaultGameMode=/Script/MuseeVision.MuseeGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.RendererSettings]
; Lumen with hardware ray tracing for the daylight and reflections; no baked lighting.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=2
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
; Glass in reflections: reflection rays go on through glass (the cases, the car, the steles show in the
; polished floors and in each other); off, every pane vanished from every reflection. Rays don't bend.
r.Lumen.Reflections.HardwareRayTracing.Translucent.Refraction.EnableForProject=True
r.MegaLights.FrontLayerTranslucency.EnableForProject=True
; Substrate: layered physical materials (haze on the polished stone, sheen on the fabrics, coloured
; transmittance and rough refraction in the glass). The legacy shading models convert automatically.
; The Adaptive (bitstream) GBuffer carries several closures a pixel; Windows already turns on rough
; diffuse, glints and refraction blur for it (BaseWindowsEngine.ini).
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
; Ray-traced shadows: soft, contact-true shadows from the sun through the eye and the lattices.
r.RayTracing.Shadows=1
; Ray trace the real Nanite geometry, not each mesh's coarse fallback: the casts, the Rodins and the trees
; otherwise shadowed and reflected as lumps, and curved surfaces self-shadowed in blotches.
r.RayTracing.Nanite.Mode=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
; Shadows are ray traced (r.RayTracing.Shadows): virtual shadow maps off. With the Atrium's 24 large
; shadowed roof lights they cost 35 ms a frame at 4K; ray-traced shadows carry them for less.
r.Shadow.Virtual.Enable=0
; Many soft-shadowed lights (the Salon's skylights, the Reserve, the Square).
r.MegaLights.EnableForProject=True
r.Nanite.ProjectEnabled=True
r.PathTracing=True
r.SkinCache.CompileShaders=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.CustomDepth=3
r.AntiAliasingMethod=4
; 4K output from DLSS Quality: rendered at 67 % (2560 x 1440) and reconstructed by DLSS 4.5 Super
; Resolution with Ray Reconstruction ([SystemSettings] below); TSR at the same scale where DLSS isn't
; available. DLAA (100 %) cost about twice as much for a difference hard to see at 4K.
r.ScreenPercentage.Default.Desktop.Mode=0
r.ScreenPercentage.Default=66.7

