[SystemSettings]
; Lumen's cached lighting in 16-bit float covers the exposures from −4 to 16 EV (the default 4 covers
; −8 to 12): a sunlit court or the Rotunda under its eye meters up to EV 15.5.
r.EyeAdaptation.CachedLightingPreExposure=8
; NVIDIA DLSS (Plugins/DLSS, from developer.nvidia.com), in place of TSR. The desktop renders at 67%
; (DLSS Quality: DefaultGameUserSettings.ini sg.ResolutionQuality=67; at 100 it was DLAA and a 4K frame took
; 35-58 ms), as does the headset (Source/MuseeVisionVR).
r.NGX.DLSS.Enable=1
; DLSS Frame Generation (Plugins/StreamlineDLSSG, with Reflex), auto: on when it helps, so the 119 Hz display
; gets about twice the rendered frames.
r.Streamline.DLSSG.Enable=2
; Vertical sync (the display's 119 Hz; with Frame Generation, Streamline paces the generated frames to it).
r.VSync=1
; Ray Reconstruction: DLSS denoises the ray-traced lighting and reflections (Lumen hit lighting,
; the glass) instead of the built-in denoisers - steadier reflections, no crawling or flicker.
r.NGX.DLSS.DenoiserMode=1
; (Lumen's reflection and shadow denoisers stay on: handed to Ray Reconstruction alone, the reflections on glass,
; Lumen's front layer, which RR doesn't clean, glittered with noise.)
; Contact occlusion traced against the scene (plinths, mouldings, joints), not only on screen.
r.Lumen.ScreenProbeGather.ShortRangeAO.HardwareRayTracing=1
; Lumen's surface cache big enough for room-scale meshes (bounce light was blotchy on long walls).
r.LumenScene.SurfaceCache.AtlasSize=8192
r.LumenScene.SurfaceCache.CardMaxResolution=1024
; The PBR texture library (4K stone and brick) and the paintings at full resolution: a 24 GB card keeps them
; resident; floors seen at a slant stay sharp. 5000 MB ran 1.5 GB over once the new wings' paintings and
; sets arrived (blurry panels, "video memory exhausted"); 10 GB leaves ~10 GB for Lumen, RT and Nanite at 4K.
r.Streaming.PoolSize=10000
r.MaxAnisotropy=16
; Area lights reflected in glass with their true penumbrae.
r.MegaLights.FrontLayerTranslucency.SoftShadows=1
